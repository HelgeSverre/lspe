[project]
name = "lspe"
version = "0.1.0"
description = "Auditable local latent-state perturbation experiments"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "MIT" }
dependencies = [
  "huggingface-hub>=0.36,<2",
  "numpy>=2.0,<3",
  "pydantic>=2.12,<3",
  "PyYAML>=6.0.2,<7",
  "typer>=0.21,<1",
]

[project.optional-dependencies]
analysis = [
  "scipy>=1.14,<2",
  "pyarrow>=18,<25",
  "matplotlib>=3.9,<4",
  "jinja2>=3.1,<4",
  "sentence-transformers>=3,<6",
]
models = [
  "mlx>=0.30,<1",
  "mlx-lm>=0.30,<1",
  "mlx-vlm>=0.3,<1",
]

[project.scripts]
lspe = "lspe.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
