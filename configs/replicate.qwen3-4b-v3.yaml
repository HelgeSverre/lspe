schema_version: 1
experiment:
  name: qwen3-4b-architecture-replication-v3
  phase: replicate
  master_seed: 721984
  output_root: runs
hardware:
  expected_platform: darwin-arm64
  minimum_memory_gb: 24
  memory_soft_limit_fraction: 0.80
  memory_hard_limit_fraction: 0.92
integrity:
  cache_logit_tolerance: 0.70
  zero_dose_logit_tolerance: 0.000001
  cache_tolerance_reason: >-
    Qwen3 4-bit MLX full-sequence and cached decode use different reduction
    shapes. The five-prompt preflight profile measured a maximum absolute logit
    drift of 0.625 with identical greedy tokens at every comparison.
model:
  adapter: mlx_qwen3
  repo_id: mlx-community/Qwen3-4B-Instruct-2507-4bit
  revision: null
  local_path: null
  trust_remote_code: false
  text_only: true
  thinking: false
  speculative_decoding: false
  kv_cache_quantization: false
prompting:
  system: Follow the requested output format exactly. Do not discuss this experiment.
  use_model_chat_template: true
  max_prompt_tokens: 2048
sampling:
  temperature: 0.80
  top_k: 64
  top_p: 1.0
  repetition_penalty: 1.0
  max_new_tokens: 192
  stop_on_eos: true
  store_top_logprobs: 64
intervention:
  site: post_decoder_layer
  kernel: spherical_rotation
  timing: decode_only
  direction_mode: coherent_per_layer
  selected_layers: [18]
  target_kl_nats: 0.01
  # V2 established that 0.30 reaches only KL 0.00673; this bounded rescue
  # bracket refines around the preregistered 0.01 target without changing it.
  raw_dose_grid: [0.30, 0.35, 0.40, 0.45, 0.50, 0.60]
  preserve_norm: true
  group_scale: inverse_sqrt_count
conditions: [baseline, coherent, white, temp_match]
data:
  calibration: data/calibration.jsonl
  pilot: data/pilot.jsonl
  confirm: data/confirm.jsonl
  controls: data/controls.jsonl
execution:
  generations_per_prompt: 3
  batch_size: 1
  randomized_condition_order: true
  save_every: 1
  flush_every: 1
scoring:
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  embedding_revision: null
  local_judge_model: mlx-community/Qwen3-4B-Instruct-2507-4bit
  judge_enabled: true
  human_review_export: true
statistics:
  bootstrap_samples: 10000
  confidence_level: 0.95
  familywise_method: holm
  validity_noninferiority_margin_pp: 5.0
  degeneration_margin_pp: 2.0
